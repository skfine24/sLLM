<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<title>Snake</title>
<style>
body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#222;font-family:sans-serif}
canvas{border:1px solid #555}
</style>
</head>
<body>
<canvas id='game' width='400' height='400'></canvas>
<div id='score' style='color:#fff;position:absolute;top:16px'>Score: 0</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let box = 20;
let snake = [{x: 9, y: 10}];
let dir = 'right';
let score = 0;
let gameOn = false;

function draw() {
    ctx.fillStyle='#333';ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    for (let i=snake.length - 1;i>=0;i--) {
        if(i == 0) { //if the first element is to be removed
            snake[i] = Object.assign({}, snake[i+1]); 
        }
        
        const head = snake[0];  
        ctx.strokeStyle="#f00";ctx.strokeRect(head.x * box, head.y * box,box,box);  
        
    }

    let newHead = { x: snake[0].x + (dir === "down" ? 1 : dir === "up" ? -1 : 0), 
                    y: snake[0].y + (dir === "left" ? -1 : dir === "right"? 1 : 0)}; 

    if(newHead.x < 0 || newHead.x >= canvas.width / box ||
       newHead.y < 0 || newHead.y >= canvas.height / box){
        alert("Game Over");
        location.reload();
    } else if(snake.find(s => s.x === newHead.x && s.y === newHead.y)) {
        alert("You won!");
        location.reload();   
    } 
    
    snake.unshift(newHead);

}

setInterval(draw, 100);

document.addEventListener('keydown', event=>{
    switch(event.keyCode){
        case 37:
            if(dir !== 'right'){
                dir = 'left'
            }
            break;
            
        case 38:
            if(dir != 'down'){
                dir = 'up'
            }
            break;
            
        case 39:
            if(dir != 'left'){
                dir = 'right'
            }
            break;
            
        case 40:
            if(dir != 'up'){
                dir = 'down'
            }
            break;
                
        default:
            return;
    }
});

</script>

</body>
</html>

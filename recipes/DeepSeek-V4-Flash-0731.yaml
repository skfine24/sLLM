# deepseek-ai/DeepSeek-V4-Flash-0731 recipe skeleton (arch deepseek_v4).
#
# STRUCTURE-ONLY (status: skeleton): parses and validates, but the engine does
# not execute deepseek_v4 yet (MLA, sparse/hash attention, HDC sinkhorn, FP4
# MoE, DSPark + 3-layer nextn are not implemented). Facts from
# docs/design/07-audit-deepseek-v4.md.

recipe_version: "1"
name: DeepSeek-V4-Flash-0731
description: sLLM native serving of deepseek-ai/DeepSeek-V4-Flash-0731 (MLA + sparse/hash + FP4 MoE + DSPark)

model_id: deepseek-ai/DeepSeek-V4-Flash-0731
arch: deepseek_v4
status: skeleton
dtype: bfloat16

quant:
  method: fp8
  fmt: e4m3
  scale_fmt: ue8m0
  activation: dynamic
  weight_block_size: [128, 128]

text:
  hidden_size: 4096
  num_layers: 43
  layer_types:
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
    - mla_attention
  full_attention:
    kernel: mla
    num_heads: 64
    num_kv_heads: 1
    head_dim: 512
  mlp:
    type: moe
    num_experts: 256
    num_experts_per_tok: 6
    shared_experts: 1
    intermediate_size: 2048
    hidden_act: silu
  vocab_size: 129280
  max_position_embeddings: 1048576
  rms_norm_eps: 1e-6

mtp:
  enabled: true
  layers: 1
  attention_type: full
  has_fc: true

tp:
  size: 2

# audited-but-not-yet-engine facts (meta passthrough)
spec:
  mla: {q_lora_rank: 1024, o_lora_rank: 1024, qk_rope_head_dim: 64}
  hdc: {hc_mult: 4, hc_sinkhorn_iters: 20, hc_eps: 1e-6, o_groups: 8}
  sparse: {num_hash_layers: 3, sliding_window: 128, index_n_heads: 64,
           index_head_dim: 128, index_topk: 512}
  rope: {type: yarn, factor: 16, theta: 10000, compress_rope_theta: 160000}
  expert_dtype: fp4
  nextn_layers: 3
  dspark: {markov_rank: 256, block_size: 5,
           target_layer_ids: [40, 41, 42], noise_token_id: 128799}
  message_encoder: encoding_dsv4

paths:
  local_dir: ~/models/DeepSeek-V4-Flash-0731

# ---- launch (consumed by the `sllm` launcher; CLI flags win) ---------------
container: sllm-node:latest

defaults:
  # NOTE: max_*/kv_utilization are planning values; engine admission
  # wiring lands with the C-phase GPU executor.
  host: 0.0.0.0
  port: 8002
  nodes: 2
  tensor_parallel: 2
  weights_gib: 156          # du -h on head (docs/design/08; GiB; docs/07: 166 GB decimal)
  max_model_len: 163840
  max_num_seqs: 4
  kv_utilization: 0.9

env:
  NCCL_DEBUG: WARN

command: |
  python -m serving.main {recipe} \
    --nodes {nodes} --mode {mode} \
    --host {host} --port {port} \
    --max-new {max_new}
